{% extends "Base.html" %}

{% block title %}
ثبت بیمار جدید
{% endblock %}

{% block content %}

<div class="page-header">
    <h1>ثبت بیمار جدید</h1>
    <p>اطلاعات کامل بیمار را وارد کنید</p>
</div>

<div class="card">

    <form method="POST" action="/add-patient">

        <div class="form-group">
            <label for="first_name">نام</label>
            <input type="text" id="first_name" name="first_name" required>
        </div>

        <div class="form-group">
            <label for="last_name">نام خانوادگی</label>
            <input type="text" id="last_name" name="last_name" required>
        </div>

        <div class="form-group">
            <label for="national_id">کد ملی</label>
            <input type="text" id="national_id" name="national_id" required>
        </div>

        <div class="form-group">
            <label for="birth_date">تاریخ تولد</label>
            <input
                type="text"
                id="birth_date"
                name="birth_date"
                placeholder="مثلاً 1375/05/20"
                required
            >
        </div>

        <div class="form-group">
            <label for="gender">جنسیت</label>

            <select id="gender" name="gender" required>
                <option value="">انتخاب کنید</option>
                <option value="مرد">مرد</option>
                <option value="زن">زن</option>
            </select>
        </div>

        <div class="form-group">
            <label for="phone">شماره تماس</label>
            <input
                type="text"
                id="phone"
                name="phone"
                placeholder="مثلاً 09123456789"
                required
            >
        </div>

        <div class="form-group">
            <label for="blood_type">گروه خونی</label>

            <select id="blood_type" name="blood_type" required>
                <option value="">انتخاب کنید</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
            </select>
        </div>

        <div class="form-group">
            <label for="weight">وزن</label>
            <input
                type="number"
                id="weight"
                name="weight"
                placeholder="وزن به کیلوگرم"
                step="0.1"
                required
            >
        </div>

        <div class="form-group">
            <label for="height">قد</label>
            <input
                type="number"
                id="height"
                name="height"
                placeholder="قد به سانتی‌متر"
                step="0.1"
                required
            >
        </div>

        <div class="form-group">
            <label for="emergency_phone">شماره تماس اضطراری</label>
            <input
                type="text"
                id="emergency_phone"
                name="emergency_phone"
                placeholder="شماره تماس فرد اضطراری"
                required
            >
        </div>

        <div class="form-group">
            <label for="medical_history">سابقه پزشکی</label>
            <textarea
                id="medical_history"
                name="medical_history"
                rows="4"
                placeholder="بیماری‌ها و سوابق پزشکی"
            ></textarea>
        </div>

        <div class="form-group">
            <label for="allergies">حساسیت‌ها</label>
            <textarea
                id="allergies"
                name="allergies"
                rows="3"
                placeholder="حساسیت‌های دارویی یا غذایی"
            ></textarea>
        </div>
        <div class="form-group">
            <label for="notes">توضیحات</label>
            <textarea
                id="notes"
                name="notes"
                rows="4"
                placeholder="توضیحات تکمیلی"
            ></textarea>
        </div>

        <div style="margin-top: 25px;">

            <button
                type="submit"
                class="primary-button"
            >
                ثبت بیمار
            </button>

            <a
                href="/patients"
                class="details-button"
                style="margin-right: 8px;"
            >
                بازگشت
            </a>

        </div>

    </form>

</div>

{% endblock %}
