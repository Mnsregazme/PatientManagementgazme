<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}سامانه مدیریت بیماران{% endblock %}</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html {
            direction: rtl;
        }


        body {
            margin: 0;

            font-family: Calibri, Arial, sans-serif;

            background-color: #f4f6f8;

            color: #333;

            direction: rtl;

            text-align: right;

            font-size: 17px;
        }


        /* =========================
           نوار سمت راست
        ========================= */

        .sidebar {
            position: fixed;

            top: 0;
            right: 0;

            width: 240px;
            height: 100vh;

            background-color: #050f36;

            color: white;

            padding: 30px 15px;

            direction: rtl;

            text-align: right;

            overflow-y: auto;

            z-index: 1000;
        }


        .sidebar h2 {
            color: white;

            text-align: center;

            font-size: 23px;

            margin-bottom: 40px;
        }


        .sidebar a {
            display: block;

            color: white;

            text-decoration: none;

            padding: 14px 16px;

            margin-bottom: 10px;

            border-radius: 8px;

            font-size: 18px;

            text-align: right;

            transition: 0.2s;
        }


        .sidebar a:hover {
            background-color: #111d4a;

            color: white;
        }


        /* =========================
           مشخصات سازنده پروژه
        ========================= */

        .creator-info {
            position: absolute;

            bottom: 25px;

            right: 15px;
            left: 15px;

            padding-top: 18px;

            border-top: 1px solid rgba(255, 255, 255, 0.2);

            text-align: center;

            color: rgba(255, 255, 255, 0.9);

            line-height: 1.8;
        }


        .creator-title {
            font-size: 14px;

            color: rgba(255, 255, 255, 0.7);

            margin-bottom: 3px;
        }


        .creator-name {
            font-size: 18px;

            font-weight: bold;

            color: white;

            margin-bottom: 2px;
        }


        .creator-university {
            font-size: 14px;

            color: rgba(255, 255, 255, 0.85);
        }


        .creator-project {
            font-size: 14px;

            color: rgba(255, 255, 255, 0.7);
        }


        /* =========================
           محتوای اصلی
        ========================= */

        .content {
            margin-right: 240px;

            min-height: 100vh;

            padding: 35px;

            direction: rtl;

            text-align: right;
        }


        /* =========================
           عنوان
        ========================= */

        .page-header {
            margin-bottom: 30px;
        }


        .page-header h1 {
            font-size: 30px;

            color: #111827;

            margin-bottom: 8px;
        }


        .page-header p {
            color: #6b7280;

            font-size: 18px;
        }


        /* =========================
           کارت
        ========================= */

        .card {
            background-color: white;

            padding: 25px;

            border-radius: 12px;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);

            margin-bottom: 25px;
        }


        /* =========================
           دکمه اصلی
        ========================= */

        .primary-button {
            display: inline-block;

            background-color: #2563eb;

            color: white;

            border: none;

            text-decoration: none;

            padding: 11px 20px;

            border-radius: 8px;

            cursor: pointer;
            font-family: inherit;

            font-size: 16px;
        }


        .primary-button:hover {
            background-color: #1d4ed8;
        }


        /* =========================
           دکمه مشاهده
        ========================= */

        .details-button {
            display: inline-block;

            background-color: #0284c7;

            color: white;

            text-decoration: none;

            padding: 8px 14px;

            border-radius: 6px;

            font-size: 15px;
        }


        .details-button:hover {
            background-color: #0369a1;
        }


        /* =========================
           دکمه حذف
        ========================= */

        .delete-button {
            background-color: #dc2626;

            color: white;

            border: none;

            padding: 8px 14px;

            border-radius: 6px;

            cursor: pointer;

            font-family: inherit;

            font-size: 15px;
        }


        .delete-button:hover {
            background-color: #b91c1c;
        }


        /* =========================
           فرم
        ========================= */

        input,
        select,
        textarea {

            width: 100%;

            padding: 12px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-family: inherit;

            font-size: 16px;

            direction: rtl;

            text-align: right;
        }


        input:focus,
        select:focus,
        textarea:focus {

            outline: none;

            border-color: #2563eb;
        }


        label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #374151;
        }


        .form-group {

            margin-bottom: 18px;
        }


        /* =========================
           جدول
        ========================= */

        table {

            width: 100%;

            border-collapse: collapse;

            direction: rtl;
        }


        th,
        td {

            padding: 15px;

            text-align: right;

            border-bottom: 1px solid #e5e7eb;
        }


        th {

            background-color: #f9fafb;

            color: #374151;
        }


        /* =========================
           موبایل
        ========================= */

        @media (max-width: 800px) {

            .sidebar {

                position: relative;

                width: 100%;

                height: auto;

                min-height: auto;

                padding-bottom: 25px;
            }


            .creator-info {

                position: relative;

                bottom: auto;

                right: auto;

                left: auto;

                margin-top: 25px;
            }


            .content {

                margin-right: 0;

                padding: 20px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         نوار سمت راست
    ========================= -->

    <aside class="sidebar">


        <h2>
            سامانه مدیریت بیماران
        </h2>


        <a href="/">
            داشبورد
        </a>


        <a href="/patients">
            بیماران
        </a>


        <a href="/add-patient">
            ثبت بیمار جدید
        </a>


        <a href="/medical-records">
            سوابق پزشکی
        </a>


        <a href="/reports">
            گزارش‌ها
        </a>


        <!-- =========================
             مشخصات پروژه
        ========================= -->

        <div class="creator-info">

            <div class="creator-title">
                طراحی و توسعه
            </div>

            <div class="creator-name">
                منصوره گزمه
            </div>

            <div class="creator-university">
                دانشجوی مهندسی پزشکی
            </div>

            <div class="creator-university">
                دانشگاه خیام
            </div>

            <div class="creator-project">
                پروژه کارشناسی
            </div>
            </div>


    </aside>


    <!-- =========================
         محتوای اصلی
    ========================= -->

    <main class="content">

        {% block content %}

        {% endblock %}

    </main>


</body>

</html>
